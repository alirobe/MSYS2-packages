# Experiment, not for upstream: rebuild msys2-runtime 3.4.3-1 from the 2022-12-16 PKGBUILD (the last with dynamicbase on)
# so the December 2022 Docker fork failure can be re-tested. Context: msys2/MSYS2-packages#6789.
name: runtime-2022
on:
  push:
    branches: [runtime-3.4.3-dec2022]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            msys2-runtime
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: base-devel msys2-devel git
      - name: Build
        env:
          MSYS: winsymlinks:native
        run: |
          git config --global user.email ci@example.com; git config --global user.name ci
          cd msys2-runtime
          makepkg --noconfirm --skippgpcheck --nocheck --syncdeps
          ls -la *.pkg.tar.*
      - name: Extract and check
        run: |
          mkdir -p out
          bsdtar -xf msys2-runtime/msys2-runtime-3.4.3-1-x86_64.pkg.tar.zst -C out usr/bin/msys-2.0.dll
          cp msys2-runtime/msys2-runtime-3.4.3-1-x86_64.pkg.tar.zst out/
          python3 -c "import struct;b=open('out/usr/bin/msys-2.0.dll','rb').read();pe=struct.unpack_from('<I',b,0x3c)[0];c=struct.unpack_from('<H',b,pe+94)[0];print('DllCharacteristics 0x%04x dynamicbase=%s highentropy=%s'%(c,bool(c&0x40),bool(c&0x20)))"
      - uses: actions/upload-artifact@v4
        with:
          name: msys2-runtime-3.4.3-1-dec2022
          path: |
            out/usr/bin/msys-2.0.dll
            out/*.pkg.tar.zst
